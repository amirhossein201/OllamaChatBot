<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Databime Chat</title>
    <style>
        body {
            background: #f0f2f5;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 600px;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        .chat-box {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: #fafafa;
        }

        .msg {
            margin: 10px 0;
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .bot {
            background: #e5e7eb;
            color: #111;
            margin-right: auto;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-top: 15px;
            resize: none;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: none;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>چت‌بات بیمه Databime 💬</h2>
            <small>سوالت رو درباره بیمه بپرس — جواب دوستانه میدم 😊</small>
        </div>

        <div class="chat-box" id="chat"></div>

        <textarea id="input" placeholder="سوالت رو بنویس... مثلاً: بیمه بدنه چی پوشش میده؟"></textarea>
        <button onclick="sendMessage()" id="btn">ارسال</button>
    </div>

    <script>
        const chatBox = document.getElementById("chat");
        const input = document.getElementById("input");
        const btn = document.getElementById("btn");

        const API = "http://localhost:5000"; // اگر سرور روی هاست هست این را تغییر بده

        function addMessage(text, who) {
            const div = document.createElement("div");
            div.className = `msg ${who}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const q = input.value.trim();
            if (!q) return;

            addMessage(q, "user");
            input.value = "";
            btn.disabled = true;
            btn.textContent = "در حال ارسال...";

            try {
                const res = await fetch(`${API}/?chat1=${encodeURIComponent(q)}`);
                const text = await res.text();
                addMessage(text, "bot");
            } catch (err) {
                addMessage("خطا در ارتباط با سرور", "bot");
            }

            btn.disabled = false;
            btn.textContent = "ارسال";
        }
    </script>
</body>

</html>
